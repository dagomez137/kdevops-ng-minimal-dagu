# SPDX-License-Identifier: copyleft-next-0.3.1
# The DAG on a free GitHub-hosted runner. The runner is a throwaway VM, so
# the root setup the README leaves to the host's owner runs here, in the one
# step that says so; everything after it runs as the runner user. Past that
# step the job runs only what a developer runs locally (dagu start, dagu
# status) and collects the files the DAG wrote.
name: fstests
run-name: "fstests: ${{ github.event_name == 'push' && 'smoke' || inputs.section }}${{ inputs.kernel_ref && format(' {0}', inputs.kernel_ref) || '' }}"

# A push runs the smoke tests, to show the whole system still works; a
# manual run runs fstests' auto group on one section, sharded.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      section:
        description: the guest/xfs.config section to run
        type: choice
        default: xfs_bs4k_ss4k
        options:
          - xfs_bs4k_ss4k
          - xfs_bs8k_ss1k
          - xfs_bs8k_ss2k
          - xfs_bs8k_ss4k
          - xfs_bs8k_ss8k
          - xfs_bs16k_ss1k
          - xfs_bs16k_ss2k
          - xfs_bs16k_ss4k
          - xfs_bs16k_ss8k
          - xfs_bs16k_ss16k
          - xfs_bs32k_ss1k
          - xfs_bs32k_ss2k
          - xfs_bs32k_ss4k
          - xfs_bs32k_ss8k
          - xfs_bs32k_ss16k
          - xfs_bs32k_ss32k
          - xfs_bs64k_ss1k
          - xfs_bs64k_ss2k
          - xfs_bs64k_ss4k
          - xfs_bs64k_ss8k
          - xfs_bs64k_ss16k
          - xfs_bs64k_ss32k
          - xfs_full_bs4k_ss4k
          - xfs_full_bs8k_ss1k
          - xfs_full_bs8k_ss2k
          - xfs_full_bs8k_ss4k
          - xfs_full_bs8k_ss8k
          - xfs_full_bs16k_ss1k
          - xfs_full_bs16k_ss2k
          - xfs_full_bs16k_ss4k
          - xfs_full_bs16k_ss8k
          - xfs_full_bs16k_ss16k
          - xfs_full_bs32k_ss1k
          - xfs_full_bs32k_ss2k
          - xfs_full_bs32k_ss4k
          - xfs_full_bs32k_ss8k
          - xfs_full_bs32k_ss16k
          - xfs_full_bs32k_ss32k
          - xfs_full_bs64k_ss1k
          - xfs_full_bs64k_ss2k
          - xfs_full_bs64k_ss4k
          - xfs_full_bs64k_ss8k
          - xfs_full_bs64k_ss16k
          - xfs_full_bs64k_ss32k
      kernel_ref:
        description: the kernel tag or branch; empty takes the DAG's default
        default: ""
      runs:
        description: how many times to run every test
        type: number
        default: 1
      publish:
        description: publish the report in release baseline-<kernel_ref>
        type: boolean
        default: false

env:
  SECTION: ${{ inputs.section || 'xfs_bs4k_ss4k' }}
  KIND: ${{ github.event_name == 'push' && 'smoke' || 'auto' }}
  FSTESTS_GROUPS: ${{ github.event_name == 'push' && '' || 'auto' }}
  FSTESTS_TESTS: ${{ github.event_name == 'push' && '$(grep --invert-match ''^#'' guest/xfs.smoke | paste --serial --delimiters='' '')' || '' }}

jobs:
  # Builds once and exports the result; every fstests job boots that.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      runs: ${{ steps.runs.outputs.runs }}
    steps:
      - id: runs
        run: echo "runs=$(seq ${{ inputs.runs || 1 }} | jq --compact-output --slurp .)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - name: Prepare the runner (root)
        run: |
          set -o xtrace
          sudo modprobe vhost_vsock
          printf '%s\n' \
            'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            'KERNEL=="vhost-vsock", GROUP="kvm", MODE="0666", OPTIONS+="static_node=vhost-vsock"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --name-match=vhost-vsock
          ls --format=long /dev/kvm /dev/vhost-vsock
          # virtiofsd's namespace sandbox maps the runner user to root in a
          # user namespace, which Ubuntu's AppArmor refuses by default.
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id --user).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id --user)" >>"$GITHUB_ENV"

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the build DAG
        run: >-
          nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
          --command dagu --config config.yaml start build --
          "export=$RUNNER_TEMP/prebuilt"
          ${{ inputs.kernel_ref && format('kernel_ref={0}', inputs.kernel_ref) || '' }}

      - name: Show the run
        if: always()
        run: >-
          nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
          --command dagu --config config.yaml status build

      # The cache is zstd already.
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt
          path: ${{ runner.temp }}/prebuilt
          compression-level: 0
          retention-days: 3

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-logs
          path: ~/.local/state/kdevops-ng-minimal-dagu/dagu/logs
          if-no-files-found: ignore

      # The tree nix store add-path took, to compare against another host's
      # build of the same tag byte for byte.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kernel
          path: ~/.local/state/kdevops-ng-minimal-dagu/linux/out
          if-no-files-found: ignore

  fstests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'push' && '[""]' || '["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]') }}
        run: ${{ fromJSON(needs.build.outputs.runs) }}
    name: fstests (${{ matrix.shard || 'smoke' }} ${{ matrix.run }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: prebuilt
          path: ${{ runner.temp }}/prebuilt

      - name: Prepare the runner (root)
        run: |
          set -o xtrace
          sudo modprobe vhost_vsock
          printf '%s\n' \
            'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            'KERNEL=="vhost-vsock", GROUP="kvm", MODE="0666", OPTIONS+="static_node=vhost-vsock"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --name-match=vhost-vsock
          ls --format=long /dev/kvm /dev/vhost-vsock
          # virtiofsd's namespace sandbox maps the runner user to root in a
          # user namespace, which Ubuntu's AppArmor refuses by default.
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id --user).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id --user)" >>"$GITHUB_ENV"

      # The exported cache is unsigned; Nix takes it from a trusted user.
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            trusted-users = root runner
            extra-substituters = file://${{ runner.temp }}/prebuilt/cache?trusted=true

      # Two guests of 2 CPUs and 4 GiB: in sizing run 39151571818 they ran a
      # slice 1.7 times faster than one guest of 2 or 4 CPUs and 2 to 12 GiB,
      # which all took the same time; 8 guest CPUs on the 4 slowed it down
      # and 1 CPU skips generic/650. The runner keeps about 7 GiB for its
      # page cache, which holds the guests' drives.
      - name: Run the DAG
        run: >-
          nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
          --command dagu --config config.yaml start fstests --
          "prebuilt=$RUNNER_TEMP/prebuilt" "sections=${{ env.SECTION }}"
          "shard=${{ matrix.shard }}" "groups=${{ env.FSTESTS_GROUPS }}" "tests=${{ env.FSTESTS_TESTS }}"
          vms=2 cpus=2 ram=4096

      - name: Show the run
        if: always()
        run: >-
          nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
          --command dagu --config config.yaml status fstests

      # Only for the report job, which merges it into its section's.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shares-${{ strategy.job-index }}
          retention-days: 1
          path: |
            ~/.local/state/kdevops-ng-minimal-dagu/dagu/logs
            ~/.local/state/kdevops-ng-minimal-dagu/reports
            ~/.local/state/qemu-system/fstests-*/xfstests
          if-no-files-found: ignore

  # The section's report: its tests merged from every guest of every job,
  # set against the section's baseline in release baseline-<kernel_ref>
  # when there is one, in one artifact with the shares it came from.
  report:
    needs: fstests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: prebuilt
          path: ${{ runner.temp }}/prebuilt

      - uses: actions/download-artifact@v5
        with:
          pattern: shares-*
          path: ${{ runner.temp }}/fstests

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            trusted-users = root runner
            extra-substituters = file://${{ runner.temp }}/prebuilt/cache?trusted=true

      # The job page shows the summary without a token; the logs and the
      # artifacts need one.
      - name: Write the report
        run: |
          run=$(echo "$RUNNER_TEMP"/fstests/*/qemu-system/*/xfstests/run | cut --delimiter=' ' --fields=1)
          echo "kernel_ref=$(sed --quiet 's/^kernel_ref=//p' "$run")" >>"$GITHUB_ENV"
          nix develop --ignore-env --keep-env-var HOME --command steps/fstests/baseline \
            --kernel-name "$(sed --quiet 's/^kernel_name=//p' "$run")" --section "$SECTION" \
            --baselines "https://github.com/$GITHUB_REPOSITORY/releases/download" --baseline "" \
            --output "$RUNNER_TEMP/baseline.env"
          . "$RUNNER_TEMP/baseline.env"
          nix develop --ignore-env --keep-env-var HOME --command steps/fstests/report \
            --shares "$(echo "$RUNNER_TEMP"/fstests/*/qemu-system/fstests-*/xfstests)" \
            --sections "$SECTION" --notrun guest/xfs.notrun --baseline "$baseline" \
            --output "$RUNNER_TEMP/report"
          { echo '```'; cat "$RUNNER_TEMP/report/report.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: shares-report
          path: ${{ runner.temp }}/report

      # The run's one fstests artifact: the report and every job's share.
      - uses: actions/upload-artifact/merge@v7
        if: always()
        with:
          name: fstests-${{ env.KIND }}-${{ env.SECTION }}
          pattern: shares-*
          separate-directories: true
          delete-merged: true

      - name: Judge the run
        run: >-
          nix develop --ignore-env --keep-env-var HOME --command steps/fstests/judge
          --outcomes "$RUNNER_TEMP/report/outcomes"

      # Only a complete run becomes a baseline, one per section.
      - name: Publish the baseline
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/report"
          for file in report.txt outcomes notrun; do
            cp "$file" "$SECTION.$file"
          done
          tag=baseline-$kernel_ref
          # A run of another section may create it between the two.
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --target "$GITHUB_SHA" --latest=false \
              --title "fstests baselines for $kernel_ref" \
              --notes "fstests' auto group on $kernel_ref: <section>.report.txt, <section>.outcomes and <section>.notrun for each section run." ||
            gh release view "$tag" >/dev/null
          gh release upload "$tag" --clobber "$SECTION.report.txt" "$SECTION.outcomes" "$SECTION.notrun"
