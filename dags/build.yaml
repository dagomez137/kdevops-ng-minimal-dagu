# SPDX-License-Identifier: copyleft-next-0.3.1
description: >-
  Build the kernel, QEMU, the fstests NixOS closure and virtiofsd, name them
  in $STATE/build.env and, given a directory, export them there for the
  fstests DAG on another host.
working_dir: ..

params:
  - name: kernel_url
    default: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
  - name: kernel_ref
    default: v7.3
  - name: qemu_url
    default: https://gitlab.com/qemu-project/qemu.git
  - name: qemu_ref
    default: v11.1.2
  # The worktree group: the directory the Linux and QEMU trees are checked
  # out in, as linux and qemu.
  - name: group
    default: $HOME/.local/state/kdevops-ng-minimal-dagu/src
  # Your own Linux and QEMU repositories (a clone, bare or not, or a
  # worktree of one): the trees in group become worktrees of them, and the
  # refs resolve there first. Empty clones one commit from the URL.
  - name: kernel_repo
    default: ""
  - name: qemu_repo
    default: ""
  # Where steps/nix/export writes; empty exports nothing.
  - name: export
    default: ""

env:
  - STATE: ${HOME}/.local/state/kdevops-ng-minimal-dagu

steps:
  - id: host
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/host/check --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: cpus

  - id: kernel_src
    depends: host
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/git/checkout
      --url ${params.kernel_url} --ref ${params.kernel_ref}
      --repo "${params.kernel_repo}" --dir "${params.group}/linux"
      --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: commit

  - id: kernel
    depends: kernel_src
    run: >-
      nix develop --ignore-env --keep-env-var HOME .#kernel
      --command steps/kernel/build --src "${params.group}/linux"
      --config kernel/imageless_defconfig --dir "$STATE/linux"
      --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: kernel

  - id: qemu_src
    depends: host
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/git/checkout
      --url ${params.qemu_url} --ref ${params.qemu_ref}
      --repo "${params.qemu_repo}" --dir "${params.group}/qemu"
      --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: commit

  - id: qemu
    depends: qemu_src
    run: >-
      nix develop --ignore-env --keep-env-var HOME .#qemu
      --command steps/qemu/build --src "${params.group}/qemu" --dir "$STATE/qemu"
      --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: qemu

  - id: closure
    depends: host
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/nix/closure --flake . --dir "$STATE/closure"
      --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: init
      - name: initrd

  - id: virtiofsd
    depends: host
    run: nix build .#virtiofsd --out-link "$STATE/virtiofsd"

  # What was built and from where; steps/fstests/describe hands it to the
  # report.
  - id: manifest
    depends: [kernel, qemu, closure, virtiofsd]
    run: >-
      printf '%s\n' kernel=${steps.kernel.outputs.kernel} qemu=${steps.qemu.outputs.qemu}
      kernel_url=${params.kernel_url} kernel_ref=${params.kernel_ref}
      kernel_commit=${steps.kernel_src.outputs.commit}
      qemu_url=${params.qemu_url} qemu_ref=${params.qemu_ref}
      init=${steps.closure.outputs.init} initrd=${steps.closure.outputs.initrd}
      "virtiofsd=$(readlink --canonicalize "$STATE/virtiofsd")/bin/virtiofsd"
      >"$STATE/build.env"

  - id: export
    depends: manifest
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/nix/export --manifest "$STATE/build.env"
      --qemu "$STATE/qemu/install"
      --shell "$(nix build --no-link --print-out-paths .#devShells.x86_64-linux.default)"
      --dir "${params.export}"
    preconditions:
      - condition: "${params.export}"
        expected: "re:.+"
