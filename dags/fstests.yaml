# SPDX-License-Identifier: copyleft-next-0.3.1
description: >-
  Build a kernel, QEMU and the fstests NixOS closure, boot them as
  qemu-system@fstests-<n>.service guests and run each fstests section as
  xfstests@<section>.service on three NVMe drives.
working_dir: ..

params:
  - name: kernel_url
    default: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
  - name: kernel_ref
    default: v7.3
  - name: qemu_url
    default: https://gitlab.com/qemu-project/qemu.git
  - name: qemu_ref
    default: v11.1.2
  # The worktree group: the directory the Linux and QEMU trees are checked
  # out in, as linux and qemu.
  - name: group
    default: $HOME/.local/state/kdevops-ng-minimal-dagu/src
  # Your own Linux and QEMU repositories (a clone, bare or not, or a
  # worktree of one): the trees in group become worktrees of them, and the
  # refs resolve there first. Empty clones one commit from the URL.
  - name: kernel_repo
    default: ""
  - name: qemu_repo
    default: ""
  # fstests from a tree in group, as xfstests: the ref of fstests_url, in
  # fstests_repo when given, as for Linux and QEMU. Empty keeps the closure's
  # pinned fstests.
  - name: fstests_url
    default: https://git.kernel.org/pub/scm/fs/xfs/xfstests-dev.git
  - name: fstests_ref
    default: ""
  - name: fstests_repo
    default: ""
  # Sections of guest/xfs.config, run one after the other.
  - name: sections
    default: xfs_bs4k_ss4k
  # fstests groups (-g) or a test list; set one, empty the other.
  - name: groups
    default: ""
  - name: tests
    default: generic/001 generic/002 generic/003 generic/004 generic/005
  # Shard I/N of the tests, so N hosts share a run; empty runs all.
  - name: shard
    default: ""
  # Guests this host splits its tests among, each with cpus CPUs and ram
  # MiB of memory.
  - name: vms
    type: integer
    default: 1
  - name: cpus
    type: integer
    default: 4
  - name: ram
    type: integer
    default: 4096
  # A directory steps/nix/export wrote on another host, to boot instead of
  # building; empty builds here.
  - name: prebuilt
    default: ""
  - name: iterations
    type: integer
    default: 1
  - name: loop_on_fail
    type: integer
    default: 0
  - name: stop_on_fail
    default: "true"
  # Seconds a test may run before systemd kills it; steps/fstests/render
  # gives the slow tests in guest/xfs.times longer.
  - name: test_timeout
    type: integer
    default: 600
  # The skips a section expects; a section listed there is incomplete when
  # it skips anything else. Empty accepts every skip.
  - name: notrun
    default: guest/xfs.notrun
  # The outcomes file, or its URL, of an earlier run to set this one
  # against, such as a release's baseline-<kernel_ref>; empty sets none.
  - name: baseline
    default: ""

env:
  # Dagu hands steps a filtered environment; systemctl --user needs this.
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
  - STATE: ${HOME}/.local/state/kdevops-ng-minimal-dagu

steps:
  - id: host
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/host/check --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: cpus

  # The kernel, QEMU, the guest's closure and virtiofsd: built here by the
  # build DAG, or taken from what its export wrote on another host. Either
  # way they end in $STATE/build.env.
  - id: build
    depends: host
    action: dag.run
    with:
      dag: build
      params:
        kernel_url: ${params.kernel_url}
        kernel_ref: ${params.kernel_ref}
        qemu_url: ${params.qemu_url}
        qemu_ref: ${params.qemu_ref}
        group: ${params.group}
        kernel_repo: ${params.kernel_repo}
        qemu_repo: ${params.qemu_repo}
        fstests_url: ${params.fstests_url}
        fstests_ref: ${params.fstests_ref}
        fstests_repo: ${params.fstests_repo}
    preconditions:
      - condition: "${params.prebuilt}"
        expected: "re:^$"
    continue_on:
      skipped: true

  - id: import
    depends: host
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/nix/import --from "${params.prebuilt}" --state "$STATE"
    preconditions:
      - condition: "${params.prebuilt}"
        expected: "re:.+"
    continue_on:
      skipped: true

  - id: inputs
    depends: [build, import]
    run: >-
      grep --extended-regexp '^(kernel|kernel_name|qemu|init|initrd|virtiofsd)='
      "$STATE/build.env" >>"$DAGU_OUTPUT_FILE"
    outputs:
      - name: kernel
      - name: kernel_name
      - name: qemu
      - name: init
      - name: initrd
      - name: virtiofsd

  - id: key
    depends: host
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/ssh/key --dir "$STATE/ssh" --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: key

  # Dagu resolves the relative working_dir of a DAG two levels down against
  # a temporary copy, so the guest and section DAGs take the checkout from
  # here.
  - id: root
    run: echo "root=$PWD" >>"$DAGU_OUTPUT_FILE"
    outputs:
      - name: root

  - id: plan
    depends: host
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/fstests/plan --vms ${params.vms} --shard "${params.shard}"
      --state "$HOME/.local/state/qemu-system" --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: guests
        type: json
      - name: shares

  - id: describe
    depends: [inputs, plan]
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/fstests/describe --build "$STATE/build.env"
      --shares "${steps.plan.outputs.shares}" --cpus ${params.cpus} --ram ${params.ram}
      --groups "${params.groups}" --tests "${params.tests}"

  # One run of the guest DAG below per guest, side by side; a failed guest
  # does not stop the others, and judge fails the run when one did not
  # finish.
  - id: guests
    depends: [describe, key, root]
    action: dag.run
    with:
      dag: guest
      params:
        root: ${steps.root.outputs.root}
        vm: ${ITEM.vm}
        shard: ${ITEM.shard}
        cpus: ${params.cpus}
        ram: ${params.ram}
        kernel: ${steps.inputs.outputs.kernel}
        qemu: ${steps.inputs.outputs.qemu}
        init: ${steps.inputs.outputs.init}
        initrd: ${steps.inputs.outputs.initrd}
        virtiofsd: ${steps.inputs.outputs.virtiofsd}
        key: ${steps.key.outputs.key}
        sections: ${params.sections}
        groups: ${params.groups}
        tests: ${params.tests}
        iterations: ${params.iterations}
        loop_on_fail: ${params.loop_on_fail}
        stop_on_fail: ${params.stop_on_fail}
        test_timeout: ${params.test_timeout}
        notrun: ${params.notrun}
    parallel:
      items: ${steps.plan.outputs.guests}
    continue_on: failed

  # One report per section, whichever guests ran its tests, under what ran:
  # the kernel (its tag, else git describe), the suite and the section. The
  # same run again replaces it.
  - id: reports
    depends: [guests, root]
    action: dag.run
    with:
      dag: report
      params:
        root: ${steps.root.outputs.root}
        section: ${ITEM}
        shares: ${steps.plan.outputs.shares}
        notrun: ${params.notrun}
        baseline: ${params.baseline}
        dir: $STATE/reports/${steps.inputs.outputs.kernel_name}/fstests/${ITEM}
    parallel:
      items: ${params.sections}

# Show what the host looks like after the run.
handler_on:
  exit:
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/host/check --output /dev/stdout

---
name: report
description: >-
  Write one section's report from every guest's share and fail when the
  section did not run to the end.
working_dir: ${params.root}

params:
  - name: root
    description: the checkout the steps run from
  - name: section
    description: the guest/xfs.config section to report
  - name: shares
    description: the xfstests shares of every guest
  - name: notrun
    description: the skips each section expects, empty for any
  - name: baseline
    description: the outcomes, or their URL, to set the section against
  - name: dir
    description: where the report goes

steps:
  - id: report
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/fstests/report --shares "${params.shares}"
      --sections ${params.section} --notrun "${params.notrun}"
      --baseline "${params.baseline}" --output "${params.dir}"

  - id: judge
    depends: report
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/fstests/judge --outcomes "${params.dir}/outcomes"

---
name: guest
description: >-
  Boot one guest, pick its shard of the tests and run each section in it,
  one at a time.
working_dir: ${params.root}

params:
  - name: root
    description: the checkout the steps run from
  - name: vm
    description: the guest's name, qemu-system@<vm>.service
  - name: shard
    description: the guest's shard I/N of the tests, empty for all
  - name: cpus
    description: the guest's CPUs
  - name: ram
    description: the guest's memory in MiB
  - name: kernel
    description: the kernel store path
  - name: qemu
    description: the QEMU binary
  - name: init
    description: the closure's init
  - name: initrd
    description: the closure's initrd
  - name: virtiofsd
    description: the virtiofsd binary
  - name: key
    description: the private key that reaches the guest
  - name: sections
    description: the guest/xfs.config sections to run
  - name: groups
    description: fstests groups, or empty
  - name: tests
    description: a test list, or empty
  - name: iterations
    description: check's -I
  - name: loop_on_fail
    description: check's -L
  - name: stop_on_fail
    description: false turns -I into -i
  - name: test_timeout
    description: seconds a test may run
  - name: notrun
    description: the skips each section expects, empty for any

env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
  - STATE: ${HOME}/.local/state/kdevops-ng-minimal-dagu
  - VM_STATE: ${HOME}/.local/state/qemu-system/${params.vm}

steps:
  - id: render
    run: >-
      nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
      --command steps/qsu/render --name ${params.vm}
      --cpus ${params.cpus} --ram ${params.ram}
      --qemu ${params.qemu} --virtiofsd ${params.virtiofsd}
      --kernel ${params.kernel} --init ${params.init} --initrd ${params.initrd}
      --key ${params.key} --state "$VM_STATE" --qsu vendor/qemu-system-units
      --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: cid

  - id: boot
    depends: render
    run: >-
      nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
      --command steps/qsu/boot --name ${params.vm} --state "$VM_STATE"
      --key ${params.key} --cid ${steps.render.outputs.cid}

  - id: shard
    depends: boot
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/fstests/shard
      --key ${params.key} --cid ${steps.render.outputs.cid} --fstype xfs
      --groups "${params.groups}" --tests "${params.tests}" --shard "${params.shard}"
      --times guest/xfs.times --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: groups
      - name: tests

  - id: discover
    depends: shard
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/fstests/discover
      --key ${params.key} --cid ${steps.render.outputs.cid}
      --tests "${steps.shard.outputs.tests}" --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: kver
      - name: devices
      - name: sector

  - id: configure
    depends: discover
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/fstests/render --catalog guest/xfs.config
      --sections "${params.sections}" --devices "${steps.discover.outputs.devices}"
      --sector ${steps.discover.outputs.sector}
      --groups "${steps.shard.outputs.groups}" --tests "${steps.shard.outputs.tests}"
      --iterations ${params.iterations} --loop-on-fail ${params.loop_on_fail}
      --stop-on-fail ${params.stop_on_fail} --test-timeout ${params.test_timeout}
      --times guest/xfs.times
      --share "$VM_STATE/xfstests" --kver ${steps.discover.outputs.kver}
      --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: share
      - name: sections

  # One section at a time, each a run of the section DAG below; a failed
  # section does not stop the next.
  - id: sections
    depends: configure
    action: dag.run
    with:
      dag: section
      params:
        root: ${params.root}
        section: ${ITEM}
        vm: ${params.vm}
        key: ${params.key}
        cid: ${steps.render.outputs.cid}
        devices: ${steps.discover.outputs.devices}
        kver: ${steps.discover.outputs.kver}
        share: ${steps.configure.outputs.share}
        notrun: ${params.notrun}
    parallel:
      items: ${steps.configure.outputs.sections}
      max_concurrent: 1
    continue_on: failed

# Stop the guest, keep its console for a crash or hang.
handler_on:
  exit:
    run: |
      nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR \
        --command systemctl --user stop qemu-system@${params.vm}.service
      nix develop --ignore-env --keep-env-var HOME \
        --command steps/qsu/console --name ${params.vm} --since-file "$DAG_RUN_WORK_DIR" \
        --file "$VM_STATE/xfstests/console.log"

---
name: section
description: >-
  Run one fstests section in the booted guest, booting it again and
  resuming the section after the tests already run when it dies, and read
  its xunit report.
working_dir: ${params.root}

params:
  - name: root
    description: the checkout the steps run from
  - name: section
    description: the guest/xfs.config section to run
  - name: vm
    description: the guest's name, qemu-system@<vm>.service
  - name: key
    description: the private key that reaches the guest
  - name: cid
    description: the guest's vsock CID
  - name: devices
    description: the guest's NVMe disks, in order
  - name: kver
    description: the guest's kernel release
  - name: share
    description: the xfstests share, with the section's config and results
  - name: notrun
    description: the skips each section expects, empty for any

steps:
  # An attempt that leaves the crashed marker, as steps/fstests/start does
  # when the guest dies, is followed by another, at most three in all.
  - id: attempt
    action: dag.run
    with:
      dag: attempt
      params:
        root: ${params.root}
        section: ${params.section}
        vm: ${params.vm}
        key: ${params.key}
        cid: ${params.cid}
        devices: ${params.devices}
        kver: ${params.kver}
        share: ${params.share}
    repeat_policy:
      repeat: while
      condition: test -e "${params.share}/${params.kver}/results/${params.section}/crashed"
      limit: 3
    continue_on: failed

  - id: report
    depends: attempt
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/fstests/report --shares ${params.share}
      --sections ${params.section} --notrun "${params.notrun}"
      --output "${params.share}/${params.kver}/results/${params.section}"

  - id: judge
    depends: report
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/fstests/judge
      --outcomes "${params.share}/${params.kver}/results/${params.section}/outcomes"

---
name: attempt
description: >-
  Boot the guest again when the last attempt left it dead, wipe the disks,
  prepare the mount points and run xfstests@<section>.service.
working_dir: ${params.root}

params:
  - name: root
    description: the checkout the steps run from
  - name: section
    description: the guest/xfs.config section to run
  - name: vm
    description: the guest's name, qemu-system@<vm>.service
  - name: key
    description: the private key that reaches the guest
  - name: cid
    description: the guest's vsock CID
  - name: devices
    description: the guest's NVMe disks, in order
  - name: kver
    description: the guest's kernel release
  - name: share
    description: the xfstests share, with the section's config and results

env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
  - VM_STATE: ${HOME}/.local/state/qemu-system/${params.vm}

steps:
  - id: boot
    run: >-
      nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
      --command steps/qsu/boot --name ${params.vm} --state "$VM_STATE"
      --key ${params.key} --cid ${params.cid}
    preconditions:
      - condition: test -e "${params.share}/${params.kver}/results/${params.section}/crashed"
    continue_on:
      skipped: true

  - id: wipe
    depends: boot
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/fstests/wipe --key ${params.key} --cid ${params.cid}
      --devices "${params.devices}"

  - id: prepare
    depends: wipe
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/fstests/prepare --key ${params.key} --cid ${params.cid}
      --section ${params.section} --share ${params.share}

  # The section's own deadline, 4.5 h: what a 6 h GitHub job has left after
  # the builds and before the upload. start stops the unit when it passes.
  - id: start
    depends: prepare
    run: >-
      nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
      --command steps/fstests/start --key ${params.key} --cid ${params.cid}
      --vm ${params.vm} --section ${params.section} --share ${params.share}
      --kver ${params.kver} --timeout 16200 --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: outcome
